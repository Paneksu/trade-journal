<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0e12">
<title>Brak połączenia — Dziennik tradingowy</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<!-- Offline shell PWA (UI v2, etap 4; wygląd spójny z logowaniem 16.10.2026): statyczna strona bez żadnych danych.
     Service worker podaje ją tylko, gdy nawigacja nie dostanie odpowiedzi z sieci; danych finansowych nie trzymamy
     w pamięci podręcznej. Znak FVG V1 i siatka wykresu 4% jak na ekranie logowania. -->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #0b0e12; color: #e6eaee; }
  body {
    font: 15px/1.6 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
    padding: max(2.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(2.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    position: relative; overflow: hidden;
  }
  .siatka { position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(to right, rgb(255 255 255 / 0.04) 1px, transparent 1px), linear-gradient(to bottom, rgb(255 255 255 / 0.04) 1px, transparent 1px);
    background-size: 40px 40px; -webkit-mask-image: radial-gradient(ellipse at 50% 38%, black 0%, transparent 70%); mask-image: radial-gradient(ellipse at 50% 38%, black 0%, transparent 70%); }
  .poswiata { position: absolute; top: 18%; left: 50%; width: min(420px, 100%); aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgb(232 164 76 / 0.16) 0%, transparent 65%); }
  main { position: relative; width: 100%; max-width: 27.5rem; text-align: center; }
  .znak { width: 96px; height: 96px; filter: drop-shadow(0 18px 44px rgb(232 164 76 / 0.26)); }
  .nazwa { margin: 16px 0 28px; font-size: 1.1875rem; line-height: 1.75rem; font-weight: 500; }
  .karta { text-align: left; background: #1c232c; border: 1px solid #353d48; border-radius: 12px; padding: 28px 24px; }
  h1 { font-size: 1.1875rem; line-height: 1.75rem; font-weight: 400; margin: 0; }
  p { color: #97a3b0; margin: 4px 0 24px; font-size: 0.8125rem; line-height: 1.25rem; }
  a { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 999px; background: #e8a44c; color: #0b0e12; font-weight: 500; text-decoration: none; }
  a:hover { background: #f0b765; }
  a:focus-visible { outline: 2px solid #e6eaee; outline-offset: 3px; }
  @media (min-width: 640px) { .znak { width: 120px; height: 120px; } .karta { padding: 36px 40px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="siatka" aria-hidden="true"></div>
<div class="poswiata" aria-hidden="true"></div>
<main>
<img class="znak" src="/icons/znak-pelny.svg" alt="" width="120" height="120">
<div class="nazwa">Dziennik</div>
<section class="karta">
<h1>Brak połączenia</h1>
<p>Dziennik nie trzyma danych na telefonie, więc bez sieci nic tu nie pokażemy. Gdy wróci zasięg, spróbuj ponownie.</p>
<a href="/">Spróbuj ponownie</a>
</section>
</main>
</body>
</html>
