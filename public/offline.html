<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0e12">
<title>Brak połączenia — Dziennik tradingowy</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<!-- Offline shell PWA (UI v2, etap 4): statyczna strona bez żadnych danych. Service worker podaje ją tylko,
     gdy nawigacja nie dostanie odpowiedzi z sieci; danych finansowych nie trzymamy w pamięci podręcznej. -->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #0b0e12; color: #e6eaee; }
  body { font: 15px/1.6 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
  main { max-width: 22rem; text-align: center; }
  svg { width: 56px; height: 56px; }
  h1 { font-size: 1.75rem; line-height: 2.25rem; font-weight: 500; margin: 20px 0 8px; letter-spacing: -0.01em; }
  p { color: #97a3b0; margin: 0 0 24px; }
  a { display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 999px; background: #e8a44c; color: #0b0e12; font-weight: 500; text-decoration: none; }
  a:hover { background: #f0b765; }
  a:focus-visible { outline: 2px solid #e8a44c; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
<defs><linearGradient id="z" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c98a35"/><stop offset=".45" stop-color="#fcd593"/><stop offset="1" stop-color="#c47f2c"/></linearGradient></defs>
<rect width="32" height="32" rx="7" fill="#0b0e12"/><rect x=".5" y=".5" width="31" height="31" rx="6.5" fill="none" stroke="#35404d"/>
<rect x="4" y="13" width="25" height="5" fill="#e8a44c" fill-opacity=".42"/>
<rect x="4" y="12.5" width="25" height="1" fill="#e8a44c"/><rect x="4" y="17.5" width="25" height="1" fill="#e8a44c"/>
<rect x="7" y="18" width="1.6" height="11" rx=".8" fill="#8c99a7"/><rect x="5" y="20" width="5.6" height="6.5" rx="1" fill="#a9b4bf"/>
<rect x="24.4" y="3" width="1.6" height="10" rx=".8" fill="#8c99a7"/><rect x="22.4" y="5" width="5.6" height="6.5" rx="1" fill="#a9b4bf"/>
<rect x="15.2" y="2.5" width="1.6" height="27" rx=".8" fill="url(#z)"/><rect x="12.6" y="5" width="6.8" height="22.5" rx="1.2" fill="url(#z)"/>
</svg>
<h1>Brak połączenia</h1>
<p>Dziennik nie trzyma danych na telefonie, więc bez sieci nic tu nie pokażemy. Gdy wróci zasięg, odśwież stronę.</p>
<a href="/">Spróbuj ponownie</a>
</main>
</body>
</html>
